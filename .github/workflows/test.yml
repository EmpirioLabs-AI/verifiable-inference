name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: The README lists every fingerprint
        run: python scripts/readme_table.py --check
      - name: Every script compiles on the oldest supported Python
        run: python -m py_compile check_model.py check_receipt.py check_transcription.py check_decision.py check_image.py check_ocr.py check_audio.py check_video.py check_mesh.py make_fingerprint.py scripts/readme_table.py scripts/document_pages.py
