name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: The README lists every fingerprint
        run: python scripts/readme_table.py --check
      - name: Every script compiles on the oldest supported Python
        run: python -m py_compile check_model.py check_receipt.py make_fingerprint.py scripts/readme_table.py
